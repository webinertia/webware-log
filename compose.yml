# ---------------------------------------------------------------------------
# Webware Log local development environment
#
# A persistent, interactive development environment that runs the full Webware
# toolchain (Composer, PHPUnit, Mago, Infection, PHPBench, roave BC-check)
# inside a container, so the host never needs a native PHP install. Works
# identically on Windows, WSL, Linux, and macOS.
#
# This compose file is the single source of truth for the environment. Two
# ways to use it:
#
#   1. VS Code Dev Container — "Reopen in Container" uses
#      .devcontainer/devcontainer.json, which is *backed by* this file (it
#      references the `tooling` service rather than defining its own).
#
#   2. Plain Docker Compose (any editor / no VS Code):
#        docker compose up -d                 # start the persistent container
#        docker compose exec tooling bash     # attach an interactive shell
#        docker compose exec tooling composer install
#        docker compose exec tooling composer test
#        docker compose exec tooling mago lint
#        docker compose down                  # stop it
#
# Webware Log's integration tests exercise the MySQL-backed PhpDbHandler, so a
# `mysql` service is enabled below (reachable from `tooling` as host `mysql`
# on port 3306), plus a `phpmyadmin` web UI at http://localhost:8080. The
# MySQL credentials mirror the CI `db-env-json` parameter (root / empty
# password / `webware_log_test` database); test data is seeded by the PHPUnit
# ListenerExtension, not by this file.
# ---------------------------------------------------------------------------

services:
  tooling:
    build:
      context: .
      args:
        # PHP version to base the image on (latest 8.4 patch release). Keep
        # in sync with the package's supported PHP versions and
        # `config.platform.php`.
        PHP_VERSION: "8.4.24"
    # Keep the container alive so `docker compose exec` can attach to it.
    # (VS Code Dev Containers override this with their own command.)
    command: sleep infinity
    stdin_open: true
    tty: true
    environment:
      # Point Composer at the named volume so its cache and global config
      # survive container rebuilds (and live on the fast Linux filesystem).
      COMPOSER_HOME: /tmp/composer-cache
      # Uncomment (or export in your shell) to enable step debugging:
      # XDEBUG_MODE: debug
    extra_hosts:
      # Lets Xdebug connect back to the host IDE from Windows, macOS, or Linux
      # (host-gateway resolves to the Docker host on every platform).
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mount the source so edits are visible on both the host and the
      # container. vendor/ is NOT overridden — it is the host's own copy.
      # Composer/installs inside the container write straight into the
      # developer's working tree on disk.
      - .:/app
      # The Composer cache lives in a named volume (Linux-native I/O, fast on
      # Windows) so downloads survive container rebuilds. It is only a cache
      # — the developer's real artifacts all live on the host.
      - composer-cache:/tmp/composer-cache
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /app

  # -------------------------------------------------------------------------
  # MySQL — required by the PhpDbHandler integration tests. Credentials mirror
  # the CI `db-env-json` (root, empty password, `webware_log_test` database).
  # The test schema and data are created by the PHPUnit ListenerExtension
  # (MysqlFixtureLoader) at test time, not by this service.
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: webware_log_test
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      # Named volume keeps the data on the fast Linux filesystem and
      # survives `docker compose down` (use `down -v` to wipe it).
      - mysql-data:/var/lib/mysql

  # -------------------------------------------------------------------------
  # phpMyAdmin — web UI for the `mysql` service above. Reachable at
  # http://localhost:8080 (auto-login as root). Note: root uses an empty
  # password, matching the test/CI convention.
  # -------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ""
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  composer-cache:
  mysql-data:
