name: "Continuous Integration"

# Branch protection blocks direct pushes to release branches, and pull_request
# already re-triggers on every commit pushed to a PR branch (synchronize), so
# there's no push:branches trigger here — only PRs (targeting numbered
# release branches) and pushed version tags.
on:
  pull_request:
    branches:
      - "[0-9]+.[0-9]+.x"
  push:
    branches:
      - "[0-9]+.[0-9]+.x"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  qa:
    uses: webinertia/webware-tools/.github/workflows/continuous-integration.yml@chore/ci-db-gating
    # CODECOV_TOKEN (org-wide) and INFECTION_DASHBOARD_API_KEY (per-repo) both
    # come through here, whichever scope actually defines each one.
    secrets: inherit
    with:
      php-versions: '["8.4", "8.5"]'
      run-integration: true
      integration-php-version: "8.5"
      # Seeded MySQL container for integration tests; DB seeding itself is
      # handled by the ListenerExtension PHPUnit bootstrap, not this workflow.
      db-image: "mysql:9.7"
      db-port: "3306"
      db-env-json: '{"MYSQL_ROOT_HOST":"%","MYSQL_DATABASE":"webware_log_test","MYSQL_ALLOW_EMPTY_PASSWORD":"true"}'
      db-health-cmd: "mysqladmin ping -h127.0.0.1 --silent"
      # The test/mutation-test jobs run directly on the runner VM (no
      # container:), so the DB is only reachable via 127.0.0.1 + the mapped
      # port, not the container name. phpunit.xml.dist defaults this to
      # "mysql" for local Docker Compose dev (container-to-container); this
      # overrides it for CI without touching that file.
      test-env-json: '{"TESTS_ADAPTER_MYSQL_HOSTNAME":"127.0.0.1"}'
      enable-codecov: true
      enable-infection: true
      # Canonical leg for coverage + mutation testing (highest supported PHP).
      coverage-php-version: "8.5"
      # Current MSI is 86%; 85% allows a slight regression without failing CI.
      min-msi: "85"
      min-covered-msi: "85"